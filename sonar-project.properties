# SonarQube Cloud — CI-based analysis (turn Automatic Analysis OFF in the project settings).
# Organisation and project key as created by the SonarQube Cloud GitHub import.
sonar.organization=whiteskytk
sonar.projectKey=WhiteSkyTK_thuso-colleague-zero

sonar.sources=src
sonar.tests=tests
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.exclusions=data/**,public/**,**/*.d.ts
# Presentational UI is not unit-tested; the engine in src/core always is.
sonar.coverage.exclusions=src/app/**,src/components/**,src/styles/**,src/hooks/**,src/lib/runService.ts

# Lesson notes and seed lists are data, not duplicated logic
sonar.cpd.exclusions=src/core/lessons/*Lessons.ts,src/core/seed/**,src/lib/demoAccounts.ts
