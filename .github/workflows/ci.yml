name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LLM_PROVIDER: mock
      MOCK_LATENCY_MS: '0'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # npm on Windows drops some optional WebAssembly packages from the lockfile that npm on Linux
      # expects (a known npm cross-platform bug), so install rather than ci, exactly as Vercel does.
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:cov
      - name: Golden demo (offline mock, must end with 0 human interventions)
        run: npm run demo
      - run: npm run build
      - name: Dependency audit (reported, not blocking during the hackathon)
        run: npm audit --audit-level=high
        continue-on-error: true
